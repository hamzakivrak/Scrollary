<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scrollary • Google ile giriş</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif;text-align:center;padding:20px;box-sizing:border-box}
.c{max-width:360px}img{width:72px;height:72px;border-radius:16px}
button,a.b{display:inline-block;margin-top:18px;padding:14px 22px;border:0;border-radius:12px;background:#3b82f6;color:#fff;font-weight:700;font-size:1rem;text-decoration:none;cursor:pointer}
p{color:#94a3b8;line-height:1.5}#msg{min-height:1.5em}
</style></head><body><div class="c">
<img src="icon.png" alt="Scrollary"><h2>Scrollary</h2>
<p id="msg">Uygulamaya giriş yapmak için Google hesabınızı seçin.</p>
<button id="go" onclick="start()">Google ile devam et</button>
<div id="back" style="display:none"><a class="b" id="backLink" href="#">Scrollary uygulamasına dön</a></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
<script>
// Scrollary Android uygulaması için giriş köprüsü: Google girişi gerçek tarayıcıda yapılır (WebView'de Google engeller),
// sonuç "scrollary://auth" bağlantısıyla uygulamaya geri verilir.
const firebaseConfig = { apiKey: "AIzaSyCVIiXeaZKfS9QpXO6LU1LlKVfbyuiTZbE", authDomain: "scrollary.firebaseapp.com", projectId: "scrollary", storageBucket: "scrollary.firebasestorage.app", messagingSenderId: "636511730600", appId: "1:636511730600:web:d61b1335232cdcfe6e3b9d", measurementId: "G-MXHQDXS8LH" };
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const msg = document.getElementById('msg');
function backToApp(idToken, accessToken) {
    const q = 'idToken=' + encodeURIComponent(idToken || '') + '&accessToken=' + encodeURIComponent(accessToken || '');
    const isAndroid = /android/i.test(navigator.userAgent);
    const url = isAndroid ? 'intent://auth?' + q + '#Intent;scheme=scrollary;package=com.scrollary.app;end' : 'scrollary://auth?' + q;
    document.getElementById('go').style.display = 'none';
    document.getElementById('back').style.display = 'block';
    document.getElementById('backLink').href = url;
    msg.textContent = 'Giriş tamam. Uygulamaya dönülüyor…';
    setTimeout(() => { location.href = url; }, 300);
}
async function start() {
    msg.textContent = 'Google açılıyor…';
    try {
        const r = await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
        const cred = firebase.auth.GoogleAuthProvider.credentialFromResult(r);
        backToApp(cred && cred.idToken, cred && cred.accessToken);
    } catch (e) {
        msg.textContent = 'Giriş yapılamadı: ' + (e && e.message ? e.message : e);
    }
}
</script></body></html>
