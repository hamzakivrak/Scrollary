name: Android Telefon APK

# Telefon için APK üretir. Android projesi bu dosyanın içinden otomatik oluşturulur
# (TV workflow'u ayrıdır: "Android TV APK"; ona dokunulmaz, paket adları farklıdır, ikisi yan yana kurulabilir).
#
# Kullanım: Actions sekmesi > "Android Telefon APK" > Run workflow
# Sonuç iki yerde olur:
#   1) Releases > "Scrollary Telefon APK" (telefonun tarayıcısından doğrudan .apk indirilir)
#   2) Çalışmanın altındaki Artifacts > Scrollary-Telefon-apk (zip)
#
# Uygulama, GitHub Pages'teki sürümü açar: https://KULLANICI.github.io/DEPO/
# Yani web tarafını güncelleyince APK'yı yeniden üretmen gerekmez; yalnızca kabuğu (WebView) değiştirirsen gerekir.
# Pages kapalıysa veya özel alan adı kullanıyorsan "app_url" kutusuna adresi yaz.
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Açılacak adres (boş bırakırsan https://KULLANICI.github.io/DEPO/)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Her çalışmada yeni imza anahtarı üretilirse yeni APK eskisinin üstüne kurulamaz ("uygulama yüklenemedi").
      # Anahtarı önbellekte tutarak imzayı sabit tutuyoruz. GitHub 7 gün hiç kullanılmayan önbelleği siler;
      # o durumda bir kez eski uygulamayı kaldırıp yenisini kurmak gerekir.
      - name: Imza anahtarini onbellekten al
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: scrollary-phone-debug-keystore-v1

      - name: Android projesini olustur
        env:
          INPUT_URL: ${{ github.event.inputs.app_url }}
        run: |
          mkdir -p phoneproj && cd phoneproj
          cat > settings.gradle <<'EOF_FILE'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ScrollaryPhone"
          include(":app")
          EOF_FILE
          cat > build.gradle <<'EOF_FILE'
          plugins {
              id 'com.android.application' version '8.3.2' apply false
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF_FILE
          mkdir -p app
          cat > app/build.gradle <<'EOF_FILE'
          plugins {
              id 'com.android.application'
          }

          // Uygulamanın açacağı adres ve sürüm numarası workflow'dan gelir:
          //   gradle assembleDebug -PappUrl=https://adresin/ -PverCode=12
          def appUrl  = project.findProperty('appUrl') ?: 'https://KULLANICI.github.io/DEPO/'
          def verCode = (project.findProperty('verCode') ?: '1').toInteger()

          android {
              namespace 'com.scrollary.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.scrollary.app'
                  minSdk 21
                  targetSdk 34
                  versionCode verCode
                  versionName "1.0.${verCode}"
                  buildConfigField 'String', 'APP_URL', "\"${appUrl}\""
              }
              buildFeatures { buildConfig true }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              buildTypes {
                  release { minifyEnabled false }
              }
          }
          EOF_FILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />

              <uses-feature android:name="android.hardware.microphone" android:required="false" />

              <queries>
                  <intent><action android:name="android.speech.RecognitionService" /></intent>
                  <intent><action android:name="android.intent.action.TTS_SERVICE" /></intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Scrollary"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden|keyboard|navigation|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="scrollary" android:host="auth" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p app/src/main/java/com/scrollary/app
          cat > app/src/main/java/com/scrollary/app/MainActivity.java <<'EOF_FILE'
          package com.scrollary.app;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.app.Dialog;
          import android.view.ViewGroup;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.Message;
          import android.view.KeyEvent;
          import android.webkit.CookieManager;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import android.webkit.JavascriptInterface;
          import java.util.ArrayList;
          import java.util.Locale;
          import org.json.JSONObject;

          /** Scrollary'yi tam ekran bir WebView içinde açar. Arayüz ve özellikler GitHub'daki web sürümünden gelir. */
          public class MainActivity extends Activity {
              private static final int REQ_FILE = 101;
              private static final int REQ_AUDIO = 102;

              private WebView web;
              private ValueCallback<Uri[]> filePathCallback;   // "Dosya seç" (ör. API anahtarı .txt aktarımı)
              private PermissionRequest pendingPermission;     // mikrofon izni beklerken

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(Color.parseColor("#0f172a"));
                  getWindow().setNavigationBarColor(Color.parseColor("#0f172a"));

                  web = new WebView(this);
                  web.setBackgroundColor(Color.parseColor("#0f172a"));
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  s.setSupportMultipleWindows(true);   // window.open -> onCreateWindow (tarayıcıda aç)
                  s.setJavaScriptCanOpenWindowsAutomatically(true);
                  // Not: "TV" ifadesi içermez; web uygulaması bunu TV modu sanmasın
                  s.setUserAgentString(s.getUserAgentString() + " ScrollaryApp");
          web.addJavascriptInterface(new NativeVoice(), "ScrollaryNative");   // mikrofon + sesli okuma köprüsü (native-voice.js)
                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(web, true);

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams params) {
                          if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                          filePathCallback = cb;
                          try {
                              startActivityForResult(params.createIntent(), REQ_FILE);
                          } catch (Exception e) {
                              filePathCallback = null;
                              return false;
                          }
                          return true;
                      }

                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> {
                              boolean wantsAudio = false;
                              for (String r : request.getResources()) {
                                  if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(r)) wantsAudio = true;
                              }
                              if (!wantsAudio) { request.deny(); return; }
                              if (Build.VERSION.SDK_INT >= 23
                                      && checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                                  pendingPermission = request;
                                  requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, REQ_AUDIO);
                              } else {
                                  request.grant(new String[]{PermissionRequest.RESOURCE_AUDIO_CAPTURE});
                              }
                          });
                      }

                      // window.open(...): Google/Firebase giriş pencereleri uygulama içinde açılır, diğer her şey telefonun tarayıcısında
                      @Override
                      public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture, Message resultMsg) {
                          final WebView tmp = new WebView(MainActivity.this);
                          WebSettings ps = tmp.getSettings();
                          ps.setJavaScriptEnabled(true);
                          ps.setDomStorageEnabled(true);
                          ps.setDatabaseEnabled(true);
                          // Google, "wv" ve "Version/x.x" içeren gömülü tarayıcıdan girişi reddeder: giriş penceresi normal Chrome gibi görünür
                          ps.setUserAgentString(ps.getUserAgentString().replace("; wv)", ")").replaceAll("Version/\\d+\\.\\d+ ", ""));
                          CookieManager.getInstance().setAcceptCookie(true);
                          CookieManager.getInstance().setAcceptThirdPartyCookies(tmp, true);
                          final Dialog[] dlg = new Dialog[1];
                          tmp.setWebChromeClient(new WebChromeClient() {
                              @Override
                              public void onCloseWindow(WebView w) { closePopup(dlg[0], tmp); }
                          });
                          tmp.setWebViewClient(new WebViewClient() {
                              private boolean decided = false;
                              private boolean isAuthUrl(String url) {
                                  try {
                                      String h = Uri.parse(url).getHost();
                                      if (h == null) return false;
                                      return h.endsWith("google.com") || h.endsWith("firebaseapp.com") || h.endsWith("gstatic.com")
                                              || h.endsWith("googleapis.com") || h.endsWith("googleusercontent.com");
                                  } catch (Exception e) { return false; }
                              }
                              private void decide(String url) {
                                  if (decided || url == null || url.startsWith("about:")) return;
                                  decided = true;
                                  if (isAuthUrl(url)) {
                                      Dialog d = new Dialog(MainActivity.this, android.R.style.Theme_DeviceDefault_NoActionBar);
                                      d.setContentView(tmp);
                                      d.setOnDismissListener(x -> destroyPopup(tmp));
                                      d.show();
                                      if (d.getWindow() != null) d.getWindow().setLayout(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT);
                                      dlg[0] = d;
                                  } else {
                                      openExternal(Uri.parse(url));
                                      new Handler(Looper.getMainLooper()).postDelayed(() -> destroyPopup(tmp), 500);
                                  }
                              }
                              @Override
                              public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                                  String u = r.getUrl().toString();
                                  decide(u);
                                  return !isAuthUrl(u) && !decidedAuth();
                              }
                              private boolean decidedAuth() { return dlg[0] != null; }
                              @Override
                              public void onPageStarted(WebView v, String url, Bitmap favicon) {
                                  decide(url);
                                  if (dlg[0] == null) v.stopLoading();
                              }
                          });
                          WebView.WebViewTransport transport = (WebView.WebViewTransport) resultMsg.obj;
                          transport.setWebView(tmp);
                          resultMsg.sendToTarget();
                          return true;
                      }
                  });

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          String scheme = u.getScheme();
                          if (!"http".equals(scheme) && !"https".equals(scheme)) {
                              openExternal(u);                 // mailto:, tel:, intent: vb.
                              return true;
                          }
                          if (!r.isForMainFrame()) return false;   // gömülü orijinal site (iframe) uygulama içinde kalsın
                          String host = u.getHost();
                          String appHost = Uri.parse(BuildConfig.APP_URL).getHost();
                          if (host != null && host.equals(appHost)) return false;
                          openExternal(u);                     // başka siteye giden bağlantı telefonun tarayıcısında açılır
                          return true;
                      }

                      @Override
                      public void onReceivedError(WebView v, WebResourceRequest r, WebResourceError e) {
                          if (r.isForMainFrame()) {
                              Toast.makeText(MainActivity.this, "Bağlantı sorunu: internet veya adres kontrol edilmeli", Toast.LENGTH_LONG).show();
                          }
                      }
                  });

                  web.loadUrl(BuildConfig.APP_URL);
                  web.requestFocus();
          handleAuthIntent(getIntent());
              }

              private void destroyPopup(WebView w) {
                  try {
                      w.stopLoading();
                      if (w.getParent() instanceof ViewGroup) ((ViewGroup) w.getParent()).removeView(w);
                      w.destroy();
                  } catch (Exception ignored) { }
              }

              private void closePopup(Dialog d, WebView w) {
                  try { if (d != null && d.isShowing()) d.dismiss(); else destroyPopup(w); } catch (Exception ignored) { }
              }

              private void openExternal(Uri uri) {
                  try {
                      startActivity(new Intent(Intent.ACTION_VIEW, uri));
                  } catch (Exception e) {
                      Toast.makeText(this, "Açılamadı: " + uri, Toast.LENGTH_SHORT).show();
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == REQ_FILE) {
                      if (filePathCallback != null) {
                          filePathCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data));
                          filePathCallback = null;
                      }
                      return;
                  }
                  super.onActivityResult(requestCode, resultCode, data);
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == REQ_STT) {
                      boolean ok = grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED;
                      if (sttWantStart) {
                          sttWantStart = false;
                          if (ok) startListening(sttLang);
                          else { js("window.__nvSTT.ev('error','not-allowed');"); js("window.__nvSTT.ev('end');"); }
                      }
                      return;
                  }
                  if (requestCode == REQ_AUDIO && pendingPermission != null) {
                      if (grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                          pendingPermission.grant(new String[]{PermissionRequest.RESOURCE_AUDIO_CAPTURE});
                      } else {
                          pendingPermission.deny();
                      }
                      pendingPermission = null;
                  }
              }

              // ---------- Yerel ses köprüsü: web tarafı native-voice.js bunları çağırır ----------
          private static final int REQ_STT = 103;
          private SpeechRecognizer recognizer;
          private boolean sttWantStart = false;
          private String sttLang = "tr-TR";
          private TextToSpeech tts;
          private boolean ttsReady = false;
          private boolean ttsFailed = false;
          private final ArrayList<Runnable> ttsQueue = new ArrayList<>();
          private final ArrayList<String> ttsQueuedIds = new ArrayList<>();

          private void js(final String code) {
              runOnUiThread(new Runnable() { public void run() { if (web != null) web.evaluateJavascript(code, null); } });
          }

          public class NativeVoice {
                  @JavascriptInterface public void openAuth(final String url) {
                      runOnUiThread(new Runnable() { public void run() {
                          try {
                              Uri u = Uri.parse(url);
                              String cur = web.getUrl();
                              String h = cur == null ? null : Uri.parse(cur).getHost();
                              if (h != null && h.equals(u.getHost()) && "https".equals(u.getScheme())) openExternal(u);
                          } catch (Exception e) { }
                      } });
                  }
                  @JavascriptInterface public String takeAuth() {
                      String a = pendingAuth; pendingAuth = null;
                      return a == null ? "" : a;
                  }
              @JavascriptInterface public void sttStart(final String lang) {
                  runOnUiThread(new Runnable() { public void run() { startListening(lang); } });
              }
              @JavascriptInterface public void sttStop() {
                  runOnUiThread(new Runnable() { public void run() { if (recognizer != null) recognizer.stopListening(); } });
              }
              @JavascriptInterface public void sttAbort() {
                  runOnUiThread(new Runnable() { public void run() { sttWantStart = false; destroyRecognizer(); } });
              }
              @JavascriptInterface public void ttsSpeak(final String id, final String text, final String lang, final double rate, final double pitch) {
                  runOnUiThread(new Runnable() { public void run() { speak(id, text, lang, (float) rate, (float) pitch); } });
              }
              @JavascriptInterface public void ttsCancel() {
                  runOnUiThread(new Runnable() { public void run() {
                      ttsQueue.clear(); ttsQueuedIds.clear();
                      if (tts != null && ttsReady) tts.stop();
                  } });
              }
          }

          private void destroyRecognizer() {
              if (recognizer != null) {
                  try { recognizer.cancel(); } catch (Exception e) { }
                  try { recognizer.destroy(); } catch (Exception e) { }
                  recognizer = null;
              }
          }

          private String sttErr(int code) {
              switch (code) {
                  case SpeechRecognizer.ERROR_NO_MATCH:
                  case SpeechRecognizer.ERROR_SPEECH_TIMEOUT: return "no-speech";
                  case SpeechRecognizer.ERROR_AUDIO: return "audio-capture";
                  case SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS: return "not-allowed";
                  case SpeechRecognizer.ERROR_NETWORK:
                  case SpeechRecognizer.ERROR_NETWORK_TIMEOUT:
                  case SpeechRecognizer.ERROR_SERVER: return "network";
                  default: return "aborted";
              }
          }

          private void startListening(String lang) {
              sttLang = (lang == null || lang.length() == 0) ? "tr-TR" : lang;
              if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                  sttWantStart = true;
                  requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, REQ_STT);
                  return;
              }
              if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                  js("window.__nvSTT.ev('error','service-not-allowed');");
                  js("window.__nvSTT.ev('end');");
                  Toast.makeText(this, "Bu telefonda ses tanıma servisi (Google) bulunamadı", Toast.LENGTH_LONG).show();
                  return;
              }
              destroyRecognizer();
              recognizer = SpeechRecognizer.createSpeechRecognizer(this);
              recognizer.setRecognitionListener(new RecognitionListener() {
                  public void onReadyForSpeech(Bundle b) { js("window.__nvSTT.ev('start');"); }
                  public void onBeginningOfSpeech() { js("window.__nvSTT.ev('speechstart');"); }
                  public void onRmsChanged(float v) { }
                  public void onBufferReceived(byte[] b) { }
                  public void onEndOfSpeech() { }
                  public void onPartialResults(Bundle b) { }
                  public void onEvent(int t, Bundle b) { }
                  public void onError(int code) {
                      js("window.__nvSTT.ev('error'," + JSONObject.quote(sttErr(code)) + ");");
                      js("window.__nvSTT.ev('end');");
                  }
                  public void onResults(Bundle b) {
                      ArrayList<String> r = b.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                      if (r != null && r.size() > 0) js("window.__nvSTT.ev('result'," + JSONObject.quote(r.get(0)) + ");");
                      else js("window.__nvSTT.ev('error','no-speech');");
                      js("window.__nvSTT.ev('end');");
                  }
              });
              Intent i = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
              i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
              i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, sttLang);
              i.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, false);
              i.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 1);
              i.putExtra(RecognizerIntent.EXTRA_CALLING_PACKAGE, getPackageName());
              try { recognizer.startListening(i); }
              catch (Exception e) {
                  js("window.__nvSTT.ev('error','aborted');");
                  js("window.__nvSTT.ev('end');");
              }
          }

          private String baseId(String uid) {
              int k = uid.indexOf('~');
              return k < 0 ? uid : uid.substring(0, k);
          }

          private void withTts(String id, Runnable r) {
              if (ttsReady) { r.run(); return; }
              if (ttsFailed) { js("window.__nvTTS.ev(" + JSONObject.quote(id) + ",'error','synthesis-unavailable');"); return; }
              ttsQueue.add(r);
              ttsQueuedIds.add(id);
              if (tts == null) {
                  tts = new TextToSpeech(this, new TextToSpeech.OnInitListener() {
                      public void onInit(final int status) {
                          runOnUiThread(new Runnable() { public void run() {
                              if (status == TextToSpeech.SUCCESS) {
                                  ttsReady = true;
                                  tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                                      public void onStart(String uid) {
                                          if (uid.indexOf('~') < 0 || uid.endsWith("~0")) js("window.__nvTTS.ev(" + JSONObject.quote(baseId(uid)) + ",'start');");
                                      }
                                      public void onDone(String uid) {
                                          if (uid.indexOf('~') < 0 || uid.endsWith("~F")) js("window.__nvTTS.ev(" + JSONObject.quote(baseId(uid)) + ",'end');");
                                      }
                                      public void onError(String uid) {
                                          js("window.__nvTTS.ev(" + JSONObject.quote(baseId(uid)) + ",'error','synthesis-failed');");
                                      }
                                  });
                                  ArrayList<Runnable> q = new ArrayList<>(ttsQueue);
                                  ttsQueue.clear(); ttsQueuedIds.clear();
                                  for (Runnable x : q) x.run();
                              } else {
                                  ttsFailed = true;
                                  for (String qid : ttsQueuedIds) js("window.__nvTTS.ev(" + JSONObject.quote(qid) + ",'error','synthesis-unavailable');");
                                  ttsQueue.clear(); ttsQueuedIds.clear();
                                  Toast.makeText(MainActivity.this, "Bu telefonda sesli okuma motoru bulunamadı", Toast.LENGTH_LONG).show();
                              }
                          } });
                      }
                  });
              }
          }

          private void speak(final String id, final String text, final String lang, final float rate, final float pitch) {
              withTts(id, new Runnable() { public void run() {
                  try {
                      tts.setLanguage(Locale.forLanguageTag(lang == null ? "tr-TR" : lang));
                      tts.setSpeechRate(Math.max(0.3f, Math.min(3.0f, rate)));
                      tts.setPitch(Math.max(0.3f, Math.min(2.5f, pitch)));
                      String t = text == null ? "" : text;
                      if (t.trim().length() == 0) { js("window.__nvTTS.ev(" + JSONObject.quote(id) + ",'start');"); js("window.__nvTTS.ev(" + JSONObject.quote(id) + ",'end');"); return; }
                      int max = 3500;
                      try { max = Math.min(max, TextToSpeech.getMaxSpeechInputLength() - 100); } catch (Throwable e) { }
                      ArrayList<String> parts = new ArrayList<>();
                      while (t.length() > max) {
                          int cut = max;
                          for (int k = max; k > max / 2; k--) { char c = t.charAt(k); if (c == '.' || c == '!' || c == '?' || c == '\n' || c == ' ') { cut = k + 1; break; } }
                          parts.add(t.substring(0, cut)); t = t.substring(cut);
                      }
                      parts.add(t);
                      if (parts.size() == 1) { tts.speak(parts.get(0), TextToSpeech.QUEUE_ADD, null, id); return; }
                      for (int k = 0; k < parts.size(); k++) {
                          String uid = id + "~" + (k == parts.size() - 1 ? "F" : Integer.toString(k));
                          tts.speak(parts.get(k), TextToSpeech.QUEUE_ADD, null, uid);
                      }
                  } catch (Exception e) {
                      js("window.__nvTTS.ev(" + JSONObject.quote(id) + ",'error','synthesis-failed');");
                  }
              } });
          }

          private volatile String pendingAuth = null;

          private void handleAuthIntent(Intent i) {
              if (i == null) return;
              Uri d = i.getData();
              if (d == null || !"scrollary".equals(d.getScheme()) || !"auth".equals(d.getHost())) return;
              String id = d.getQueryParameter("idToken"), at = d.getQueryParameter("accessToken");
              if ((id == null || id.length() == 0) && (at == null || at.length() == 0)) return;
              try {
                  JSONObject o = new JSONObject();
                  o.put("idToken", id == null ? "" : id);
                  o.put("accessToken", at == null ? "" : at);
                  pendingAuth = o.toString();
              } catch (Exception e) { return; }
              i.setData(null);
              if (web != null) js("window.__nativeAuthPoll && window.__nativeAuthPoll();");
          }

          @Override
          protected void onNewIntent(Intent i) {
              super.onNewIntent(i);
              setIntent(i);
              handleAuthIntent(i);
          }

          @Override
          protected void onDestroy() {
              destroyRecognizer();
              if (tts != null) { try { tts.stop(); tts.shutdown(); } catch (Exception e) { } }
              super.onDestroy();
          }

          // GERİ tuşu: önce web uygulamasındaki pencere/sayfa kapanır, kök ekranda uygulamadan çıkılır
              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK && web != null && web.canGoBack()) {
                      web.goBack();
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }

              // Not: WebView.onPause()/onResume() bilerek elle çağrılmıyor. Chromium WebView görünürlüğü kendisi yönetir;
              // elle çağrı bazı cihazlarda tarayıcıdan/başka uygulamadan dönünce kaydırmanın donmasına yol açabiliyor.
          }
          EOF_FILE
          # Uygulama simgesi: depodaki icon.png (512x512)
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          cp "$GITHUB_WORKSPACE/icon.png" app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          # Açılacak adres: kutuya yazıldıysa o, yoksa GitHub Pages adresi
          APP_URL="$INPUT_URL"
          if [ -z "$APP_URL" ]; then
            APP_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          fi
          echo "$APP_URL" > app_url.txt
          echo "Acilacak adres: $APP_URL"

      - name: APK derle
        working-directory: phoneproj
        run: |
          gradle assembleDebug -PappUrl="$(cat app_url.txt)" -PverCode=${{ github.run_number }} --no-daemon

      - name: APK dosyasini hazirla
        run: cp phoneproj/app/build/outputs/apk/debug/app-debug.apk Scrollary-Telefon.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Scrollary-Telefon-apk
          path: Scrollary-Telefon.apk

      # Telefonun tarayıcısından zip açmadan doğrudan indirilebilsin diye Releases'a da koyar.
      # Bu adım başarısız olursa (ör. Actions yazma izni kapalı) yukarıdaki Artifacts yine kullanılabilir.
      - name: Releases sayfasina yukle
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete phone-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create phone-latest Scrollary-Telefon.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Scrollary Telefon APK (build ${{ github.run_number }})" \
            --notes "Telefonda bu sayfadan Scrollary-Telefon.apk dosyasini indirip kur. Acilan adres: $(cat phoneproj/app_url.txt)" \
            --prerelease
